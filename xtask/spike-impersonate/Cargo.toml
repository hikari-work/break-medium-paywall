[package]
name = "spike-impersonate"
version = "0.1.0"
edition = "2024"
# `wreq` 0.16.1's MSRV. This is now the same number the root workspace declares;
# it was higher when the spike was written, and the root moved up to match after
# the measurement (see `exclude` in ../../Cargo.toml). It stays written out
# literally because nothing here inherits: see the empty `[workspace]` below.
rust-version = "1.98"
publish = false
description = "SPIKE-1 candidate: TLS-impersonating Medium fetch, measured against the curl_cffi baseline."

# This package is EXCLUDED from the root workspace (see `exclude` in
# ../../Cargo.toml), which means it inherits nothing: no
# `version.workspace = true`, no `edition.workspace = true`, no
# `[lints] workspace = true` — those would fail to resolve, because there is no
# enclosing `[workspace.package]`/`[workspace.lints]` for a package the root
# workspace refuses to own. The empty table below makes that explicit instead of
# leaving it to the parent's `exclude`.
[workspace]

[features]
default = ["wreq-transport"]
# Off means no BoringSSL: `cargo run --no-default-features -- --dry-run` then
# builds with no cmake/clang, so argument parsing, request construction and
# JSONL emission stay developable on a machine that cannot build the C++ tree.
wreq-transport = ["dep:wreq", "dep:wreq-util", "dep:async-trait"]

[dependencies]
# The request surface is consumed, never re-declared: `request::{ENDPOINT,
# FULL_POST_QUERY, headers, body, operation_id, client_date_ms}`. Both sides of
# the measurement must send the same bytes, and a copied header block is exactly
# the kind of drift that is invisible until the gate fails for the wrong reason.
medium-client = { path = "../../crates/medium-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
async-trait = { version = "0.1", optional = true }
# Pinned exactly: this is a measurement, so the impersonation profile and the
# BoringSSL revision behind it are part of the result, not an implementation
# detail. `wreq` is the successor to `rquest`, which §3.1 named — `rquest` 5.2.0
# is yanked and its crates.io metadata is broken.
wreq = { version = "=0.16.1", optional = true, features = ["socks"] }
# Where the profiles live: `wreq_util::Emulation::Chrome110` is the counterpart
# of the `impersonate="chrome110"` that `api.py:75` pins.
wreq-util = { version = "=0.2.0", optional = true, features = ["emulation"] }

[lints.rust]
unsafe_code = "forbid"
