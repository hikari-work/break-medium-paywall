# Pinned to `stable` rather than an exact version so a fresh clone can build
# offline. Bump deliberately, and keep .github/workflows/rust.yml in sync.
#
# The floor is `[workspace.package] rust-version` in Cargo.toml — 1.98 as of the
# SPIKE-1 measurement, raised for `wreq`. This channel is not that floor: a
# toolchain newer than `stable` at any given moment is fine here, and CI's
# `dtolnay/rust-toolchain@stable` is what actually has to satisfy it.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
