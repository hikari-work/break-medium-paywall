services:
  redis_service:
    container_name: redis_service
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    ulimits:
      memlock: -1
    networks:
      - freedium_net
    profiles:
      - prod
      # Added in Fase 4, and it is a requirement rather than a convenience:
      # `freedium-web`'s `AppState::new` completes a Redis handshake
      # (`RedisStore::connect` → `client.init()`), so the Rust instance cannot
      # start without a Redis in its profile. Python is lazier — it tolerates a
      # missing Redis at runtime via `safe_check_redis_connection` — which is why
      # `local` worked without this line until the shadow arrived. Present in
      # both profiles also means the two instances share one cache, which is what
      # makes comparing them a fair test.
      - local
    volumes:
      - freedium_dragonflydata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      start_period: 20s
      timeout: 10s
      retries: 3
    restart: always
    stop_grace_period: 2m
    mem_limit: 5g

  postgres_freedium:
    image: postgres:16.3-alpine3.20
    container_name: postgres_freedium
    hostname: postgres_freedium
    networks:
      - freedium_net
    volumes:
      - ../postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    stop_grace_period: 2m

  # `pgadmin4_freedium` (dpage/pgadmin4) used to sit here; removed 2026-09-12.
  #
  # Nothing depended on it — it was a human-facing Postgres UI. Three things
  # made it worse than it looked: it published `5433:80`, the host port the
  # borrowed `klon-pg` holds and the one `.env`'s host-run `DATABASE_URL`
  # points at, so it could not start while that Postgres was up; it carried no
  # `profiles:` key, so it sat in the *default* profile and was meant to come
  # up in production as well; and `.env` gave it `root@root.com` / `root`.
  #
  # `psql` against `postgres_freedium` covers the same need without a
  # published port. A pgAdmin is one `docker run` away when it is wanted.

volumes:
  freedium_dragonflydata:
