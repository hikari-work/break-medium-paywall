[package]
name = "medium-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "TLS-impersonating Medium GraphQL client, in-process proxy pool. Phase 2 of the Rust rewrite."
publish = false

[lints]
workspace = true

[features]
default = ["wreq-transport"]
# The impersonating transport, and therefore BoringSSL (`btls`/`btls-sys`) with
# its cmake + libclang + perl build requirements.
#
# **On by default, because production needs it**: `medium.com/_/graphql` rejects
# `reqwest`, so a server built without this cannot fetch a cache miss at all.
# Turning it off gives a build with no C++ toolchain and a `reqwest`-only
# transport — the SPIKE-1 harness uses that to develop its argument parsing and
# JSONL emission on a machine that cannot compile the C++ tree.
#
# Note there is no `dep:async-trait` here, unlike the spike's feature list: in
# this crate `async-trait` is a *mandatory* dependency, and cargo rejects `dep:`
# for a dependency that is not optional.
wreq-transport = ["dep:wreq", "dep:wreq-util"]

[dependencies]
# `resolver::HttpLinkResolver` implements `medium_doc::resolve::LinkResolver`,
# so this crate depends on the IR crate and not the other way round — the seam
# stays with the caller and the network stays with this crate (§2.6).
medium-doc = { path = "../medium-doc" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
# The impersonating client. Both pins are exact and deliberate — see the
# commentary in the root manifest before touching either.
wreq = { workspace = true, optional = true }
wreq-util = { workspace = true, optional = true }
# `generate_random_sha256_hash` (`medium_parser/utils.py:117`) is SHA-256 over 32
# bytes from `secrets.token_bytes()`.
sha2 = { workspace = true }
getrandom = { workspace = true }
# `generate_random_sha256_hash` returns a hex digest, so the operation id is hex.
hex = { workspace = true }

[dev-dependencies]
