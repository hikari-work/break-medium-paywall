[workspace]
resolver = "3"
members = ["crates/*", "xtask/*"]
# `xtask/spike-impersonate` holds the SPIKE-1 harness. It is kept out of the
# workspace because it is a measurement harness, not production code: it writes
# JSONL and a sidecar, its `main.rs` is 800 lines of argument parsing, and none
# of that belongs in a workspace whose other members ship. Its own README carries
# the measurement.
#
# It is a real package with its own manifest now — see its README for the
# measurement — not the empty directory this exclusion was written for.
#
# **The C++ toolchain is no longer a reason to exclude it.** That was the
# original rationale, and it stopped being true once the impersonating transport
# moved into `crates/medium-client`: the root workspace now builds BoringSSL
# (`btls`/`btls-sys`, not the `boring2` this comment used to name — the crates
# were renamed upstream, and `boring2` appears nowhere in either lockfile)
# whether or not the spike is a member. Keeping the exclusion costs nothing and
# keeps the harness's dependencies out of the production tree.
#
# `edge` is here for the same reason and is the case §3.4 predicted. It is its
# own workspace root by its own `[workspace]` table — `members` above is
# `crates/*` and `xtask/*`, so nothing matches it — and this entry is what makes
# that fact visible to someone reading the root manifest rather than only to
# someone reading `edge/Cargo.toml`. What it keeps out: Pingora, and therefore
# the TLS-provider question that SPIKE-3 is about.
exclude = ["xtask/spike-impersonate", "edge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Raised to 1.98 for `wreq` 0.16.1 (§3.1 option 1 — adopted after the SPIKE-1
# measurement). `crates/medium-client` now depends on it, so this is load-bearing
# rather than groundwork.
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
regex = "1"
url = "2"
form_urlencoded = "1"
psl = "2"

# --- Fase 2: the I/O layer (freedium-cache, medium-client) -------------------
#
# These are the first dependencies in the workspace that pull a large tree
# (TLS, async runtimes, a Postgres driver). That is the price of the I/O
# layer; the Fase 1 crates stay dependency-light and are unaffected.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
thiserror = "2"
async-trait = "0.1"
hex = "0.4"
# 32 random bytes for the X-APOLLO-OPERATION-ID hash, replacing Python's
# `secrets.token_bytes()`. `getrandom` rather than `rand`: we want entropy, not
# a PRNG API, and `rand`'s has churned across 0.8/0.9/0.10.
getrandom = "0.4"
sha2 = "0.11"
rmp-serde = "1"
# Pinned to 0.8 rather than 0.9. The MSRV is no longer the reason — 0.9's 1.94
# is below the 1.98 declared above. The reason is that 0.8 is the version Fase 2
# was written and verified against, and moving a database driver is its own
# change with its own verification, not a rider on a toolchain bump.
# 0.9 also buys nothing here: this crate uses runtime `sqlx::query()` only, never
# the `query!` macros, so the build needs no live DATABASE_URL and no `macros`
# feature.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "tls-rustls-ring",
] }
fred = "10"
# `socks` is the feature the plan calls out (§1's `aiohttp_socks` row). rustls
# rather than the native-tls default so the build needs no OpenSSL headers.
reqwest = { version = "0.13", default-features = false, features = [
    "socks",
    "json",
    "http2",
    "rustls",
    "charset",
    "gzip",
] }

# --- SPIKE-1's answer: the impersonating client (§3.1 option 1) --------------
#
# `wreq` is the successor to the `rquest` §3.1 named — `rquest` 5.2.0 is yanked
# and its crates.io metadata is broken. It builds BoringSSL (`btls`/`btls-sys`),
# which is why this is the one entry here whose build needs more than a C
# compiler: cmake, libclang for bindgen, and perl for BoringSSL's assembler.
# `crates/freedium-web/Dockerfile` installs all three.
#
# **Exact pins, not caret ranges.** The profile and the BoringSSL revision behind
# it are part of the SPIKE-1 result, not an implementation detail: a `0.16` range
# could resolve a later `wreq`, and the measurement — parity 1.0000 against the
# `curl_cffi` baseline, 150/150 requests at HTTP 200 — would then describe a
# different artifact than production runs. Moving either pin means re-running the
# measurement in `xtask/spike-impersonate`.
#
# `socks` matches `reqwest`'s feature above: the pool hands out
# `socks5://host:port` strings and both transports parse them with the same
# expectation. `wreq-util`'s `emulation` is what provides `Profile::Chrome110`.
#
# Default features are left ON, exactly as the spike declared them. Trimming them
# would be a different configuration from the one measured — the whole point of
# the pins above — and nothing here has established which of `wreq`'s defaults
# the transport actually relies on.
wreq = { version = "=0.16.1", features = ["socks"] }
wreq-util = { version = "=0.2.0", features = ["emulation"] }

# HTML parsing, used only by the differential-testing normalizer. Kept out of
# the production crates: Fase 1 emits HTML from the IR and never parses it back.
# The versions are pinned as a pair — `markup5ever_rcdom` 0.39 requires
# html5ever ^0.39, and a mismatched html5ever would give the two crates separate
# `markup5ever` trees, so the `NodeData` types would not line up.
html5ever = "0.39"
markup5ever_rcdom = "0.39"

# --- Fase 3: the page templates ---------------------------------------------
#
# `minijinja` 2.x, not 3.x: 3.0 is still an alpha, and the whole point of using
# this engine is that it is the closest thing in Rust to the Jinja2 the legacy
# templates were written for. `minijinja-embed` compiles `templates/` into the
# binary, so the runtime image needs no template directory — which is what lets
# it be distroless.
minijinja = "2"
minijinja-embed = "2"

# --- Fase 6: the public API --------------------------------------------------
#
# `governor` directly, **not `tower_governor`**. Three of the four buckets are not
# shaped like a layer: the miss bucket is charged from *inside* a handler, after
# the cache lookup has already been made, and the fetch budget is process-global
# rather than keyed. The fourth wants `X-RateLimit-*` headers and an RFC 9457
# body, neither of which `tower_governor` produces — so the layer would be ~15
# lines of glue plus 100% of a dependency. See `freedium-web::api::limit`.
#
# `dashmap` is governor's default store and is what makes the keyed map safe to
# share; `retain_recent` on a `tokio` interval is what keeps it bounded, because
# a key an attacker chooses must not be able to grow it forever.
governor = "0.10"

# `macros` brings `utoipa-gen`: the `ToSchema`/`OpenApi` derives. `axum_extras`
# is what lets an axum extractor type appear in a `#[utoipa::path]` signature.
# `preserve_order` is off, so the spec's key order is the derive's rather than
# insertion order — deterministic either way, and the smaller feature set.
utoipa = { version = "5", default-features = false, features = [
    "macros",
    "axum_extras",
] }
# The Scalar UI at `/api/v1/docs`, which is the /docs half of §2.7.
utoipa-scalar = { version = "0.3", features = ["axum"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
