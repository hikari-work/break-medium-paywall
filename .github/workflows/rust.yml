# CI for the Rust rewrite (RUST_REWRITE_PLAN §5, Fase 0: "setup workspace cargo + CI").
#
# HOSTING: `origin` is github.com:hikari-work/break-medium-paywall, so this file
# is live — the earlier note claiming origin was Codeberg and the workflow inert
# was written before the remote moved, and was wrong from that point on. The
# rewrite happens on `rust/*` branches while `main` stays frozen at the Python
# baseline (75d1433), so `rust/**` is listed under `push` as well: a gate that
# only runs on a branch nobody pushes to is not a gate.
#
# The Python jobs are deliberately absent: this workflow covers only the Rust
# workspace. `legacy/medium-parser/` keeps its own toolchain story for now.

name: rust

on:
  push:
    branches: [main, 'rust/**']
  pull_request:

# A newer push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml (channel "stable", rustfmt + clippy).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # SPIKE-1's verdict landed the impersonating client in
      # `crates/medium-client`, so this job now compiles BoringSSL for `btls-sys`
      # and needs three tools it never used to.
      #
      # `edge-check` below deliberately has no install step, on the grounds that
      # the runners already carry cmake. This job does not take that on trust:
      # it needs three packages, not one, and `libclang-dev` is the one least
      # likely to be present. `btls-sys` build-depends on `bindgen` with its
      # `runtime` feature and calls `generate_bindings` unconditionally, so
      # clang-sys dlopens `libclang.so` at build-script time — the failure is a
      # "could not find libclang" that names neither the crate nor this file.
      # `perl` is BoringSSL's assembler preprocessor. `clang` the *compiler* is
      # not needed unless `fips` is on, which is a different thing again.
      #
      # Installing explicitly costs seconds; the alternative is a gate that works
      # only as long as the runner image happens to keep shipping these.
      - name: Build tools for BoringSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libclang-dev perl

      - name: Format
        run: cargo fmt --all --check

      # `-D warnings` here rather than via RUSTFLAGS so it applies to this
      # workspace's crates, which is what lints.toml already sets to warn.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Fase 4: the Pingora edge, which lives in `edge/`. A **separate cargo
  # workspace** with its own `Cargo.lock` (RUST_REWRITE_PLAN §3.4), which is why
  # this is a job of its own rather than three more lines in `check`:
  # `cargo fmt --all` at the root does not reach `edge/`, so without this the
  # edge would have no gate at all. It depends on the main workspace's
  # `crates/page-canonical` **by path** — §3.4's whole point is that the edge and
  # the render gate cannot fork the definition of a difference — so a change
  # there can break this build, and that coupling is exactly what is worth
  # testing on every push.
  edge-check:
    name: edge · fmt / clippy / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `workspaces: edge` so the cache key follows the edge's own lockfile
      # rather than the root one, which cannot describe this build.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge

      # One dependency here needs a tool the root workspace does not:
      # `pingora-core` pulls `flate2`, which pulls `libz-ng-sys`, whose build
      # script compiles zlib-ng **with cmake**. The Ubuntu runners already have
      # it, so there is deliberately no install step — but `edge/Dockerfile` does
      # have to install it, and a reader comparing the two files should know why
      # they differ.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # SPIKE-2 (§3.2): the Rust difflib port must make the same boolean decision as
  # CPython at the `> 80` threshold. Split into its own job so a parity
  # regression is distinguishable from a build failure at a glance.
  difflib-parity:
    name: SPIKE-2 difflib parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Production runs python:3.12.3 (Dockerfile:1). difflib.SequenceMatcher is
      # the thing under test, so the reference must come from the same
      # interpreter that runs in production — not from whatever is newest.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build harness
        run: cargo build --release -p difftest

      - name: Generate corpus
        run: ./target/release/difftest gen-cases --out "${RUNNER_TEMP}/cases.jsonl"

      # The gate is only reproducible if the corpus is. A second generation must
      # be byte-identical; this catches a HashMap iteration order or clock that
      # creeps into the generator and silently makes the gate unrepeatable.
      - name: Corpus must be deterministic
        run: |
          ./target/release/difftest gen-cases --out "${RUNNER_TEMP}/cases-again.jsonl"
          cmp "${RUNNER_TEMP}/cases.jsonl" "${RUNNER_TEMP}/cases-again.jsonl"
          echo "corpus is byte-identical across runs"

      - name: Generate Python reference
        run: |
          python3 xtask/difftest/py/difflib_ref.py \
            --cases "${RUNNER_TEMP}/cases.jsonl" \
            --out "${RUNNER_TEMP}/ref.jsonl"

      # Non-zero on any ratio-bit, percentage-bit, or decision difference. Also
      # fails on a degenerate corpus (all-true, all-false, or nothing landing
      # exactly on 80.0), since a 100% match against such a corpus is no
      # evidence at all.
      - name: Compare
        run: |
          ./target/release/difftest run-difflib \
            --cases "${RUNNER_TEMP}/cases.jsonl" \
            --reference "${RUNNER_TEMP}/ref.jsonl"

  # Fase 1 (§4): medium-doc + medium-render must produce the same HTML as the
  # legacy renderer, compared in the canonical form rather than by tree shape —
  # see crates/page-canonical/src/canonical.rs for what that does and does not
  # forgive. It moved out of this harness in Fase 4 so the Pingora edge can
  # compare the same way instead of growing a second implementation.
  #
  # The reference here is the **real** legacy code, imported out of `legacy/`
  # with its outside world stubbed (xtask/difftest/py/stubs.py). Nothing is
  # copied, so this job cannot drift from the implementation it is measuring.
  render-parity:
    name: Fase 1 render parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Production runs python:3.12 with Jinja2==3.1.2
      # (legacy/medium-parser/requirements.txt:9). The reference output depends
      # on both: Jinja's `Undefined` is what turns a missing `alt` into the empty
      # string and a null one into `None`, so an unpinned Jinja could change the
      # baseline itself rather than the thing being measured.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the reference's only dependency
        run: pip install Jinja2==3.1.2

      - name: Build harness
        run: cargo build --release -p difftest

      - name: Generate corpus
        run: |
          ./target/release/difftest gen-render-cases \
            --out "${RUNNER_TEMP}/render-cases.jsonl"

      # Same reasoning as the difflib job: a gate is only reproducible if its
      # corpus is, and fixtures are read in file-name order precisely so that
      # this holds.
      - name: Corpus must be deterministic
        run: |
          ./target/release/difftest gen-render-cases \
            --out "${RUNNER_TEMP}/render-cases-again.jsonl"
          cmp "${RUNNER_TEMP}/render-cases.jsonl" "${RUNNER_TEMP}/render-cases-again.jsonl"
          echo "corpus is byte-identical across runs"

      - name: Render with the legacy implementation
        run: |
          python3 xtask/difftest/py/render_ref.py \
            --cases "${RUNNER_TEMP}/render-cases.jsonl" \
            --out "${RUNNER_TEMP}/render-ref.jsonl"

      # Non-zero on an undeclared difference, on a `expected_divergence`
      # declaration that no longer diverges, on a fixture the legacy renderer
      # could not render at all, and on a corpus too thin to have caught a
      # broken port.
      - name: Compare
        run: |
          ./target/release/difftest run-render \
            --cases "${RUNNER_TEMP}/render-cases.jsonl" \
            --reference "${RUNNER_TEMP}/render-ref.jsonl"
